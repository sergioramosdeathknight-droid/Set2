<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Seni Seviyorum</title>
<style>
  /* ==========================================================
     RESET & BASE
     ========================================================== */
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  html {
    scroll-behavior: smooth;
    background: #000;
  }

  body {
    background: #000;
    color: #fff;
    font-family: 'Cormorant Garamond', 'Playfair Display', 'Didot', Georgia, 'Times New Roman', serif;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    text-rendering: optimizeLegibility;
    overflow-x: hidden;
    font-feature-settings: "kern" 1, "liga" 1;
  }

  ::selection {
    background: #fff;
    color: #000;
  }

  /* ==========================================================
     SPLASH SCREEN
     ========================================================== */
  .splash {
    position: fixed;
    inset: 0;
    z-index: 9999;
    background: #000;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: opacity 0.6s cubic-bezier(0.4, 0, 0.2, 1),
                visibility 0.6s cubic-bezier(0.4, 0, 0.2, 1);
  }

  .splash.hidden {
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
  }

  .splash-inner {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 3rem;
  }

  .s-letter {
    font-size: clamp(5rem, 16vw, 10rem);
    font-weight: 300;
    font-style: italic;
    line-height: 1;
    letter-spacing: -0.02em;
    color: #fff;
    text-shadow:
      0 0 20px rgba(255, 255, 255, 0.3),
      0 0 60px rgba(255, 255, 255, 0.12);
    opacity: 0;
    transform: scale(0.9);
    animation: splashLetterIn 1.2s cubic-bezier(0.22, 1, 0.36, 1) 0.1s forwards;
  }

  @keyframes splashLetterIn {
    to {
      opacity: 1;
      transform: scale(1);
    }
  }

  /* Yükleniyor çubuğu */
  .loader {
    width: 160px;
    height: 1px;
    background: rgba(255, 255, 255, 0.1);
    overflow: hidden;
    position: relative;
    opacity: 0;
    animation: fadeIn 0.5s ease 0.6s forwards;
  }

  .loader::after {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(
      90deg,
      transparent 0%,
      rgba(255, 255, 255, 0.9) 50%,
      transparent 100%
    );
    transform: translateX(-100%);
    animation: loaderSweep 1.8s cubic-bezier(0.4, 0, 0.2, 1) 0.8s forwards;
  }

  @keyframes loaderSweep {
    to {
      transform: translateX(100%);
    }
  }

  @keyframes fadeIn {
    to {
      opacity: 1;
    }
  }

  /* Splash çıkış animasyonu */
  .splash.dismiss .s-letter {
    animation: splashLetterOut 0.7s cubic-bezier(0.4, 0, 1, 1) forwards;
  }

  .splash.dismiss .loader {
    opacity: 0;
    transition: opacity 0.3s ease;
  }

  @keyframes splashLetterOut {
    0% {
      opacity: 1;
      transform: scale(1);
      filter: blur(0);
    }
    100% {
      opacity: 0;
      transform: scale(1.15);
      filter: blur(12px);
    }
  }

  /* ==========================================================
     ANA SAHNE
     ========================================================== */
  #scene {
    position: relative;
    width: 100%;
    height: 100vh;
    overflow: hidden;
    background: #000;
    isolation: isolate;
  }

  #canvas {
    position: absolute;
    inset: 0;
    z-index: 1;
    display: block;
    width: 100%;
    height: 100%;
  }

  /* Grain katmanı (CSS ile destek) */
  .grain-overlay {
    position: absolute;
    inset: 0;
    z-index: 2;
    pointer-events: none;
    opacity: 0.035;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
    mix-blend-mode: screen;
    animation: grainShift 0.15s steps(2) infinite;
  }

  @keyframes grainShift {
    0%, 100% { transform: translate(0, 0); }
    25%      { transform: translate(-2%, 1%); }
    50%      { transform: translate(1%, -1%); }
    75%      { transform: translate(-1%, -2%); }
  }

  /* Vignette */
  .vignette {
    position: absolute;
    inset: 0;
    z-index: 3;
    pointer-events: none;
    background: radial-gradient(
      ellipse at center,
      transparent 30%,
      rgba(0, 0, 0, 0.35) 60%,
      rgba(0, 0, 0, 0.75) 100%
    );
  }

  /* Yazı alanı */
  .stage {
    position: absolute;
    inset: 0;
    z-index: 4;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-end;
    padding: 0 1.5rem 12vh;
    pointer-events: none;
    text-align: center;
  }

  .title {
    font-size: min(clamp(2rem, 7.5vw, 5rem), 12vh);
    font-weight: 300;
    font-style: italic;
    letter-spacing: 0.01em;
    line-height: 1.05;
    color: transparent;
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 0.02em;
  }

  .title .char {
    display: inline-block;
    color: #fff;
    text-shadow:
      0 0 20px rgba(255, 255, 255, 0.15),
      0 0 60px rgba(255, 255, 255, 0.06);
    opacity: 0;
    transform: translateY(18px);
    filter: blur(8px);
    animation: charIn 1.6s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    animation-delay: var(--delay);
    will-change: opacity, transform, filter;
  }

  @keyframes charIn {
    0% {
      opacity: 0;
      transform: translateY(18px);
      filter: blur(8px);
    }
    100% {
      opacity: 1;
      transform: translateY(0);
      filter: blur(0);
    }
  }

  .title .space {
    display: inline-block;
    width: 0.35em;
  }

  /* Alt çizgi */
  .divider {
    margin-top: 2.2rem;
    width: 0;
    height: 1px;
    background: linear-gradient(
      90deg,
      transparent,
      rgba(255, 255, 255, 0.5),
      transparent
    );
    animation: dividerGrow 2.2s cubic-bezier(0.22, 1, 0.36, 1) 3.5s forwards;
  }

  @keyframes dividerGrow {
    to {
      width: min(50%, 240px);
    }
  }

  /* ==========================================================
     TIKTOK BÖLÜMÜ
     ========================================================== */
  #tiktok-section {
    position: relative;
    background: #000;
    padding: 7rem 1.5rem 5rem;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 3rem;
    border-top: 1px solid rgba(255, 255, 255, 0.08);
  }

  .tiktok-heading {
    font-size: clamp(1.5rem, 3.5vw, 2.2rem);
    font-weight: 300;
    font-style: italic;
    color: #fff;
    letter-spacing: 0.04em;
    opacity: 0.9;
    text-align: center;
  }

  .tiktok-card {
    width: 100%;
    max-width: 480px;
    border-radius: 20px;
    overflow: hidden;
    background: #0a0a0a;
    border: 1px solid rgba(255, 255, 255, 0.08);
    box-shadow:
      0 30px 80px rgba(0, 0, 0, 0.8),
      0 0 60px rgba(255, 255, 255, 0.02);
    transition: transform 0.5s cubic-bezier(0.22, 1, 0.36, 1),
                box-shadow 0.5s cubic-bezier(0.22, 1, 0.36, 1);
    position: relative;
  }

  .tiktok-card:hover {
    transform: translateY(-4px);
    box-shadow:
      0 40px 100px rgba(0, 0, 0, 0.9),
      0 0 80px rgba(255, 255, 255, 0.04);
  }

  .tiktok-card iframe {
    display: block;
    width: 100%;
    aspect-ratio: 9 / 16;
    border: none;
    background: #000;
  }

  .tiktok-link {
    display: inline-flex;
    align-items: center;
    gap: 0.7rem;
    padding: 1rem 2.4rem;
    border-radius: 999px;
    text-decoration: none;
    color: #000;
    background: #fff;
    font-size: 0.82rem;
    font-family: 'Helvetica Neue', 'Arial', sans-serif;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    font-weight: 500;
    transition: transform 0.3s cubic-bezier(0.22, 1, 0.36, 1),
                box-shadow 0.3s cubic-bezier(0.22, 1, 0.36, 1),
                background 0.3s ease;
    box-shadow: 0 8px 30px rgba(255, 255, 255, 0.08);
  }

  .tiktok-link:hover {
    transform: scale(1.03);
    box-shadow: 0 12px 40px rgba(255, 255, 255, 0.15);
    background: #f0f0f0;
  }

  .tiktok-link:active {
    transform: scale(0.98);
  }

  .tiktok-link svg {
    width: 16px;
    height: 16px;
    fill: currentColor;
    flex-shrink: 0;
  }

  .tiktok-note {
    color: rgba(255, 255, 255, 0.25);
    font-size: 0.72rem;
    font-family: 'Helvetica Neue', 'Arial', sans-serif;
    letter-spacing: 0.15em;
    text-align: center;
    max-width: 380px;
    line-height: 1.8;
    text-transform: uppercase;
    font-weight: 400;
  }

  /* ==========================================================
     FOOTER
     ========================================================== */
  .footer {
    background: #000;
    padding: 3rem 1.5rem;
    text-align: center;
    border-top: 1px solid rgba(255, 255, 255, 0.05);
  }

  .footer p {
    color: rgba(255, 255, 255, 0.2);
    font-size: 0.68rem;
    font-family: 'Helvetica Neue', 'Arial', sans-serif;
    letter-spacing: 0.3em;
    text-transform: uppercase;
  }

  /* ==========================================================
     MEDYA SORGULARI
     ========================================================== */
  @media (max-width: 768px) {
    .stage {
      padding: 0 1rem 10vh;
    }

    #tiktok-section {
      padding: 5rem 1rem 3rem;
    }

    .tiktok-card {
      max-width: 100%;
    }

    .title {
      font-size: min(clamp(1.8rem, 9vw, 3.5rem), 10vh);
    }
  }

  @media (max-width: 480px) {
    .s-letter {
      font-size: 6rem;
    }

    .loader {
      width: 120px;
    }

    .tiktok-link {
      padding: 0.85rem 1.8rem;
      font-size: 0.72rem;
      letter-spacing: 0.15em;
    }
  }

  @media (prefers-reduced-motion: reduce) {
    .grain-overlay {
      animation: none;
    }
    .title .char,
    .s-letter,
    .loader,
    .divider {
      animation-duration: 0.01ms !important;
      animation-delay: 0ms !important;
    }
  }
</style>
</head>
<body>

<!-- ==========================================================
     SPLASH
     ========================================================== -->
<div class="splash" id="splash">
  <div class="splash-inner">
    <div class="s-letter">S.</div>
    <div class="loader"></div>
  </div>
</div>

<!-- ==========================================================
     ANA SAHNE
     ========================================================== -->
<div id="scene">
  <canvas id="canvas"></canvas>
  <div class="grain-overlay"></div>
  <div class="vignette"></div>
  <div class="stage">
    <h1 class="title" id="title"></h1>
    <div class="divider"></div>
  </div>
</div>

<!-- ==========================================================
     TIKTOK
     ========================================================== -->
<section id="tiktok-section">
  <h2 class="tiktok-heading">Bizi İzle</h2>

  <div class="tiktok-card">
    <!--
      Video ID'sini biliyorsan aşağıdaki src'yi

      allow="autoplay; encrypted-media; picture-in-picture"

    ></iframe>

  <a class="tiktok-link" href="https://vt.tiktok.com/ZSpUF1jWa/" target="_blank" rel="noopener noreferrer">
    <svg viewBox="0 0 24 24" aria-hidden="true">
      <path d="M12.53.02C13.84 0 15.14.01 16.44 0c.08 1.53.63 3.09 1.75 4.17 1.12 1.11 2.7 1.62 4.24 1.79v4.03c-1.44-.05-2.89-.35-4.2-.97-.57-.26-1.1-.59-1.62-.93-.01 2.92.01 5.84-.02 8.75-.08 1.4-.54 2.79-1.35 3.94-1.31 1.92-3.58 3.17-5.91 3.21-1.43.08-2.86-.31-4.08-1.03-2.02-1.19-3.44-3.37-3.65-5.71-.02-.5-.03-1-.01-1.49.18-1.9 1.12-3.72 2.58-4.96 1.66-1.44 3.98-2.13 6.15-1.72.02 1.48-.04 2.96-.04 4.44-.99-.32-2.15-.23-3.02.37-.63.41-1.11 1.04-1.36 1.75-.21.51-.15 1.07-.14 1.61.24 1.64 1.82 3.02 3.5 2.87 1.12-.01 2.19-.66 2.77-1.61.19-.33.4-.67.41-1.06.1-1.79.06-3.57.07-5.36.01-4.03-.01-8.05.02-12.07z"/>

  <p class="tiktok-note">

<script>
/* ==========================================================
   SENI SEVIYORUM — MONOCHROME GRAPHICS ENGINE
   Fully self-contained, no dependencies
   ========================================================== */
(function () {
  'use strict';

  /* ==========================================================
     GLOBAL CONFIG
     ========================================================== */
  const CONFIG = {
    heart: {
      edgeDensity: 3200,          // kenar parçacık sayısı (ekran boyutuna göre ölçeklenir)
      innerDensityRatio: 0.32,    // iç dolgu oranı
      scaleDivisor: 42,           // kalp ölçek böleni (büyüdükçe kalp küçülür)
      centerYRatio: 0.38,         // kalbin dikey merkezi (0 = üst, 1 = alt)
      jitterRadius: 1.8,          // kenar dağınıklığı
      innerJitter: 1.4,
      stiffnessMin: 0.035,
      stiffnessMax: 0.075,
      dampingMin: 0.87,
      dampingMax: 0.93,
      mouseForceRadius: 160,
      mouseForceStrength: 3.2,
      baseSizeMin: 0.35,
      baseSizeMax: 1.6,
      alphaMin: 0.25,
      alphaMax: 0.9,
      hueBase: 0,                 // monokrom — kullanılmıyor ama yapı için
    },
    ambient: {
      count: 220,
      sizeMin: 0.25,
      sizeMax: 1.1,
      alphaMin: 0.05,
      alphaMax: 0.35,
      speedMin: 0.02,
      speedMax: 0.35,
    },
    bokeh: {
      count: 34,
      radiusMin: 22,
      radiusMax: 90,
      alphaMin: 0.015,
      alphaMax: 0.075,
      speedMin: 0.03,
      speedMax: 0.22,
    },
    farStars: {
      count: 180,
      sizeMin: 0.2,
      sizeMax: 1.0,
      alphaMin: 0.05,
      alphaMax: 0.6,
      parallaxFactor: 0.015,
    },
    constellation: {
      maxDistance: 110,
      maxConnections: 3,
      alphaFactor: 0.15,
    },
    pulse: {
      bpm: 60,
      amplitude: 0.09,
      doubleBeat: true,
    },
    grain: {
      tileSize: 200,
      intensity: 0.05,
    },
    trails: {
      enabled: true,
      fade: 0.18,
    },
  };

  /* ==========================================================
     UTILITY FUNCTIONS
     ========================================================== */
  const Util = {
    rand(min, max) {
      return Math.random() * (max - min) + min;
    },
    randInt(min, max) {
      return Math.floor(this.rand(min, max + 1));
    },
    lerp(a, b, t) {
      return a + (b - a) * t;
    },
    clamp(v, min, max) {
      return v < min ? min : v > max ? max : v;
    },
    dist2(x1, y1, x2, y2) {
      const dx = x2 - x1;
      const dy = y2 - y1;
      return dx * dx + dy * dy;
    },
    easeOutCubic(t) {
      return 1 - Math.pow(1 - t, 3);
    },
    easeInOutCubic(t) {
      return t < 0.5
        ? 4 * t * t * t
        : 1 - Math.pow(-2 * t + 2, 3) / 2;
    },
    grey(v, alpha) {
      // Monokrom yardımcı: 0-255 gri → rgba
      const c = Math.round(v);
      return `rgba(${c},${c},${c},${alpha})`;
    },
  };

  /* ==========================================================
     HEART PARAMETRIC CURVE
     ========================================================== */
  const HeartMath = {
    /**
     * Klasik kalp eğrisi:
     *   x = 16 sin³(t)
     *   y = 13 cos(t) − 5 cos(2t) − 2 cos(3t) − cos(4t)
     * Canvas Y aşağı pozitif olduğu için işaret tersine çevrilir,
     * sonra görsel denge için −6 ofset uygulanır.
     */
    point(t) {
      const sinT = Math.sin(t);
      const x = 16 * sinT * sinT * sinT;
      const cosT = Math.cos(t);
      const y = -(
        13 * cosT -
        5 * Math.cos(2 * t) -
        2 * Math.cos(3 * t) -
        Math.cos(4 * t)
      );
      return { x, y: y - 6 };
    },
  };

  /* ==========================================================
     HEARTBEAT CURVE
     "Lub-dub" iki vuruşlu kalp atışı eğrisi
     ========================================================== */
  function heartbeat(timestamp) {
    const beatDuration = 60000 / CONFIG.pulse.bpm;
    const p = (timestamp % beatDuration) / beatDuration;

    // İlk vuruş (güçlü)
    if (p < 0.09) {
      return Math.sin((p / 0.09) * Math.PI) * 0.8;
    }
    // Kısa duraklama
    if (p < 0.18) {
      return 0;
    }
    // İkinci vuruş (zayıf)
    if (p < 0.26) {
      return Math.sin(((p - 0.18) / 0.08) * Math.PI) * 0.4;
    }
    return 0;
  }

  /* ==========================================================
     GLOW SPRITE CACHE
     Merkezi parlak → dışa doğru şeffaf yumuşak disk.
     ctx.createRadialGradient her karede pahalı olduğu için
     tek seferlik önbelleğe alınır.
     ========================================================== */
  const GlowCache = (() => {
    const cache = new Map();

    function get(size, brightness) {
      const bucket = Math.max(2, Math.round(size));
      const brightBucket = Math.round(brightness * 10) / 10;
      const key = `${bucket}_${brightBucket}`;
      if (cache.has(key)) return cache.get(key);

      const radius = bucket * 6;
      const c = document.createElement('canvas');
      c.width = radius * 2;
      c.height = radius * 2;
      const g = c.getContext('2d');

      const grad = g.createRadialGradient(
        radius, radius, 0,
        radius, radius, radius
      );
      const inner = Util.clamp(brightBucket, 0, 1);
      grad.addColorStop(0, `rgba(255,255,255,${0.9 * inner})`);
      grad.addColorStop(0.25, `rgba(255,255,255,${0.35 * inner})`);
      grad.addColorStop(0.6, `rgba(255,255,255,${0.08 * inner})`);
      grad.addColorStop(1, 'rgba(255,255,255,0)');

      g.fillStyle = grad;
      g.fillRect(0, 0, radius * 2, radius * 2);

      cache.set(key, { canvas: c, radius });
      return cache.get(key);
    }

    return { get };
  })();

  /* ==========================================================
     FILM GRAIN — Offscreen noise tile
     ========================================================== */
  const Grain = (() => {
    let tile = null;
    let ctxTile = null;
    let pattern = null;
    let patternCtx = null;

    function buildTile() {
      const size = CONFIG.grain.tileSize;
      tile = document.createElement('canvas');
      tile.width = size;
      tile.height = size;
      ctxTile = tile.getContext('2d');

      const imageData = ctxTile.createImageData(size, size);
      const data = imageData.data;
      for (let i = 0; i < data.length; i += 4) {
        const v = Math.random() * 255;
        data[i] = v;
        data[i + 1] = v;
        data[i + 2] = v;
        data[i + 3] = Math.random() * 60;  // çok düşük alfa
      }
      ctxTile.putImageData(imageData, 0, 0);
    }

    function ensurePattern(ctx) {
      if (!tile) buildTile();
      if (!pattern) {
        pattern = ctx.createPattern(tile, 'repeat');
      }
    }

    function render(ctx, w, h, offsetX, offsetY) {
      ensurePattern(ctx);
      ctx.save();
      ctx.globalCompositeOperation = 'screen';
      ctx.globalAlpha = CONFIG.grain.intensity;
      ctx.translate(offsetX, offsetY);
      ctx.fillStyle = pattern;
      ctx.fillRect(-offsetX, -offsetY, w + 100, h + 100);
      ctx.restore();
    }

    function regenerate() {
      buildTile();
      pattern = null;
    }

    return { render, regenerate };
  })();

  /* ==========================================================
     SCENE STATE
     ========================================================== */
  const State = {
    canvas: null,
    ctx: null,
    W: 0,
    H: 0,
    DPR: 1,
    cx: 0,
    cy: 0,
    heartScale: 1,
    lastTime: 0,
    globalTime: 0,
    frameCount: 0,
    mouse: { x: -9999, y: -9999, active: false },
    mouseNorm: { x: 0, y: 0 },
    shake: { x: 0, y: 0, decay: 1 },
    ripples: [],
    reducedMotion: false,
  };

  /* ==========================================================
     PARTICLE SYSTEMS
     ========================================================== */
  const Systems = {
    heart: [],
    ambient: [],
    bokeh: [],
    farStars: [],
  };

  /* --------------------------------------------------------
     Heart particle factory
     -------------------------------------------------------- */
  function createHeartParticles() {
    Systems.heart.length = 0;

    const area = State.W * State.H;
    const edgeCount = Math.min(
      CONFIG.heart.edgeDensity,
      Math.floor(area / 380)
    );

    // Kenar parçacıkları
    for (let i = 0; i < edgeCount; i++) {
      const t = (i / edgeCount) * Math.PI * 2;
      const base = HeartMath.point(t);

      const jAngle = Math.random() * Math.PI * 2;
      const jRadius = Math.pow(Math.random(), 2.2) * CONFIG.heart.jitterRadius;
      const jx = Math.cos(jAngle) * jRadius;
      const jy = Math.sin(jAngle) * jRadius;

      const px = State.cx + (base.x + jx) * State.heartScale;
      const py = State.cy + (base.y + jy) * State.heartScale;

      Systems.heart.push({
        x: px,
        y: py,
        vx: 0,
        vy: 0,
        baseX: base.x,
        baseY: base.y,
        jx,
        jy,
        size: Util.rand(CONFIG.heart.baseSizeMin, CONFIG.heart.baseSizeMax),
        alpha: Util.rand(CONFIG.heart.alphaMin, CONFIG.heart.alphaMax),
        phase: Math.random() * Math.PI * 2,
        speed: Util.rand(0.006, 0.03),
        wobble: Util.rand(0.15, 0.85),
        stiffness: Util.rand(
          CONFIG.heart.stiffnessMin,
          CONFIG.heart.stiffnessMax
        ),
        damping: Util.rand(
          CONFIG.heart.dampingMin,
          CONFIG.heart.dampingMax
        ),
      });
    }

    // İç dolgu parçacıkları
    const innerCount = Math.floor(edgeCount * CONFIG.heart.innerDensityRatio);
    for (let i = 0; i < innerCount; i++) {
      const t = Math.random() * Math.PI * 2;
      const r = Math.sqrt(Math.random()) * 0.92;
      const base = HeartMath.point(t);
      const bx = base.x * r;
      const by = base.y * r;

      const jAngle = Math.random() * Math.PI * 2;
      const jRadius = Math.random() * CONFIG.heart.innerJitter;
      const jx = Math.cos(jAngle) * jRadius;
      const jy = Math.sin(jAngle) * jRadius;

      Systems.heart.push({
        x: State.cx + (bx + jx) * State.heartScale,
        y: State.cy + (by + jy) * State.heartScale,
        vx: 0,
        vy: 0,
        baseX: bx,
        baseY: by,
        jx,
        jy,
        size: Util.rand(0.25, 0.85),
        alpha: Util.rand(0.05, 0.28),
        phase: Math.random() * Math.PI * 2,
        speed: Util.rand(0.008, 0.025),
        wobble: Util.rand(0.1, 0.4),
        stiffness: Util.rand(0.025, 0.055),
        damping: Util.rand(0.9, 0.94),
      });
    }
  }

  /* --------------------------------------------------------
     Ambient particles (her yöne süzülenler)
     -------------------------------------------------------- */
  function createAmbientParticles() {
    Systems.ambient.length = 0;
    const count = CONFIG.ambient.count;

    for (let i = 0; i < count; i++) {
      Systems.ambient.push({
        x: Math.random() * State.W,
        y: Math.random() * State.H,
        vx: Util.rand(-0.15, 0.15),
        vy: Util.rand(-CONFIG.ambient.speedMax, -CONFIG.ambient.speedMin),
        size: Util.rand(CONFIG.ambient.sizeMin, CONFIG.ambient.sizeMax),
        alpha: Util.rand(CONFIG.ambient.alphaMin, CONFIG.ambient.alphaMax),
        phase: Math.random() * Math.PI * 2,
        speed: Util.rand(0.003, 0.015),
      });
    }
  }

  /* --------------------------------------------------------
     Bokeh field (bulanık derinlik)
     -------------------------------------------------------- */
  function createBokeh() {
    Systems.bokeh.length = 0;

    for (let i = 0; i < CONFIG.bokeh.count; i++) {
      Systems.bokeh.push({
        x: Math.random() * State.W,
        y: Math.random() * State.H,
        r: Util.rand(CONFIG.bokeh.radiusMin, CONFIG.bokeh.radiusMax),
        vy: -Util.rand(CONFIG.bokeh.speedMin, CONFIG.bokeh.speedMax),
        alpha: Util.rand(CONFIG.bokeh.alphaMin, CONFIG.bokeh.alphaMax),
        phase: Math.random() * Math.PI * 2,
        speed: Util.rand(0.002, 0.008),
      });
    }
  }

  /* --------------------------------------------------------
     Far stars (parallax)
     -------------------------------------------------------- */
  function createFarStars() {
    Systems.farStars.length = 0;
    for (let i = 0; i < CONFIG.farStars.count; i++) {
      Systems.farStars.push({
        x: Math.random() * State.W,
        y: Math.random() * State.H,
        size: Util.rand(CONFIG.farStars.sizeMin, CONFIG.farStars.sizeMax),
        alpha: Util.rand(CONFIG.farStars.alphaMin, CONFIG.farStars.alphaMax),
        phase: Math.random() * Math.PI * 2,
        speed: Util.rand(0.001, 0.006),
      });
    }
  }

  /* ==========================================================
     RESIZE
     ========================================================== */
  function resize() {
    State.DPR = Math.min(window.devicePixelRatio || 1, 2);
    State.W = window.innerWidth;
    State.H = window.innerHeight;
    State.canvas.width = State.W * State.DPR;
    State.canvas.height = State.H * State.DPR;
    State.canvas.style.width = State.W + 'px';
    State.canvas.style.height = State.H + 'px';
    State.ctx.setTransform(State.DPR, 0, 0, State.DPR, 0, 0);

    State.cx = State.W / 2;
    State.cy = State.H * CONFIG.heart.centerYRatio;
    State.heartScale = Math.min(
      State.W / CONFIG.heart.scaleDivisor,
      State.H / (CONFIG.heart.scaleDivisor + 4)
    );

    // Sistemleri yeniden kur
    createHeartParticles();
    createAmbientParticles();
    createBokeh();
    createFarStars();
  }

  /* ==========================================================
     INPUT HANDLERS
     ========================================================== */
  function attachInput() {
    window.addEventListener('mousemove', (e) => {
      const rect = State.canvas.getBoundingClientRect();
      State.mouse.x = e.clientX - rect.left;
      State.mouse.y = e.clientY - rect.top;
      State.mouse.active = true;
      State.mouseNorm.x = (e.clientX / State.W - 0.5) * 2;
      State.mouseNorm.y = (e.clientY / State.H - 0.5) * 2;
    });

    window.addEventListener('mouseleave', () => {
      State.mouse.active = false;
      State.mouse.x = -9999;
      State.mouse.y = -9999;
    });

    window.addEventListener('touchmove', (e) => {
      const rect = State.canvas.getBoundingClientRect();
      const touch = e.touches[0];
      State.mouse.x = touch.clientX - rect.left;
      State.mouse.y = touch.clientY - rect.top;
      State.mouse.active = true;
      State.mouseNorm.x = (touch.clientX / State.W - 0.5) * 2;
      State.mouseNorm.y = (touch.clientY / State.H - 0.5) * 2;
    }, { passive: true });

    window.addEventListener('touchend', () => {
      State.mouse.active = false;
    });

    // Tıklama → monokrom ripple
    State.canvas.addEventListener('pointerdown', (e) => {
      const rect = State.canvas.getBoundingClientRect();
      State.ripples.push({
        x: e.clientX - rect.left,
        y: e.clientY - rect.top,
        r: 0,
        maxR: Math.max(State.W, State.H) * 0.5,
        alpha: 0.6,
      });
      State.shake.x = Util.rand(-3, 3);
      State.shake.y = Util.rand(-3, 3);
      State.shake.decay = 1;
    });

    window.addEventListener('resize', resize);
  }

  /* ==========================================================
     RENDER LAYER — far stars
     ========================================================== */
  function renderFarStars() {
    const ctx = State.ctx;
    const px = State.mouseNorm.x * CONFIG.farStars.parallaxFactor * State.W;
    const py = State.mouseNorm.y * CONFIG.farStars.parallaxFactor * State.H;

    for (const star of Systems.farStars) {
      star.phase += star.speed;
      const tw = 0.55 + Math.sin(star.phase) * 0.45;
      const a = star.alpha * tw;

      let x = star.x - px;
      let y = star.y - py;

      // Sonsuz sarmal
      if (x < -10) x += State.W + 20;
      if (x > State.W + 10) x -= State.W + 20;
      if (y < -10) y += State.H + 20;
      if (y > State.H + 10) y -= State.H + 20;

      ctx.beginPath();
      ctx.fillStyle = Util.grey(255, a);
      ctx.arc(x, y, star.size, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  /* ==========================================================
     RENDER LAYER — bokeh
     ========================================================== */
  function renderBokeh(dt) {
    const ctx = State.ctx;

    for (const b of Systems.bokeh) {
      b.y += b.vy * dt;
      b.phase += b.speed * dt;

      if (b.y < -b.r * 2) {
        b.y = State.H + b.r * 2;
        b.x = Math.random() * State.W;
      }

      const a = b.alpha * (0.6 + Math.sin(b.phase) * 0.4);
      const grad = ctx.createRadialGradient(
        b.x, b.y, 0,
        b.x, b.y, b.r
      );
      grad.addColorStop(0, Util.grey(255, a));
      grad.addColorStop(0.5, Util.grey(230, a * 0.4));
      grad.addColorStop(1, Util.grey(200, 0));

      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  /* ==========================================================
     RENDER LAYER — ambient
     ========================================================== */
  function renderAmbient(dt) {
    const ctx = State.ctx;

    for (const p of Systems.ambient) {
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      p.phase += p.speed * dt;

      if (p.y < -20) {
        p.y = State.H + 20;
        p.x = Math.random() * State.W;
      }
      if (p.x < -20) p.x = State.W + 20;
      if (p.x > State.W + 20) p.x = -20;

      const tw = 0.55 + Math.sin(p.phase) * 0.45;
      const a = p.alpha * tw;

      const sprite = GlowCache.get(p.size * 6, 0.7);
      ctx.globalAlpha = a;
      ctx.drawImage(
        sprite.canvas,
        p.x - sprite.radius,
        p.y - sprite.radius,
        sprite.radius * 2,
        sprite.radius * 2
      );
      ctx.globalAlpha = 1;

      ctx.beginPath();
      ctx.fillStyle = Util.grey(255, Math.min(1, a + 0.25));
      ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  /* ==========================================================
     RENDER LAYER — aurora / soft light behind heart
     ========================================================== */
  function renderAurora(beat) {
    const ctx = State.ctx;
    const pulse = 1 + beat * 0.09;
    const radius = Math.min(State.W, State.H) * 0.42 * pulse;

    const grad = ctx.createRadialGradient(
      State.cx, State.cy, 0,
      State.cx, State.cy, radius
    );
    grad.addColorStop(0,    Util.grey(255, 0.05));
    grad.addColorStop(0.35, Util.grey(230, 0.022));
    grad.addColorStop(0.7,  Util.grey(180, 0.008));
    grad.addColorStop(1,    Util.grey(120, 0));

    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, State.W, State.H);
  }

  /* ==========================================================
     RENDER LAYER — heart particles (spring physics)
     ========================================================== */
  function renderHeart(dt, beat) {
    const ctx = State.ctx;
    const pulse = 1 + beat * CONFIG.pulse.amplitude;

    for (const p of Systems.heart) {
      // Faz ilerlemesi
      p.phase += p.speed * dt;

      // Titreşim
      const wx = Math.sin(p.phase * 0.6) * p.wobble;
      const wy = Math.cos(p.phase * 0.72) * p.wobble;

      // Hedef pozisyon
      const targetX =
        State.cx + (p.baseX + p.jx + wx) * State.heartScale * pulse;
      const targetY =
        State.cy + (p.baseY + p.jy + wy) * State.heartScale * pulse;

      // Yay kuvveti
      const dx = targetX - p.x;
      const dy = targetY - p.y;
      p.vx += dx * p.stiffness;
      p.vy += dy * p.stiffness;

      // Fare itmesi
      if (State.mouse.active) {
        const mdx = p.x - State.mouse.x;
        const mdy = p.y - State.mouse.y;
        const d2 = mdx * mdx + mdy * mdy;
        const radius = CONFIG.heart.mouseForceRadius;
        const r2 = radius * radius;

        if (d2 < r2 && d2 > 0.01) {
          const d = Math.sqrt(d2);
          const force = (1 - d / radius) * CONFIG.heart.mouseForceStrength;
          p.vx += (mdx / d) * force;
          p.vy += (mdy / d) * force;
        }
      }

      // Sönümleme
      p.vx *= p.damping;
      p.vy *= p.damping;

      // Pozisyon güncelle
      p.x += p.vx * dt;
      p.y += p.vy * dt;

      // Işıma (önbellek kullan)
      const tw = 0.65 + Math.sin(p.phase * 1.3) * 0.35;
      const a = p.alpha * tw;
      const s = p.size * pulse;

      const sprite = GlowCache.get(s, 0.9);
      ctx.globalAlpha = a * 0.9;
      ctx.drawImage(
        sprite.canvas,
        p.x - sprite.radius,
        p.y - sprite.radius,
        sprite.radius * 2,
        sprite.radius * 2
      );
      ctx.globalAlpha = 1;

      // Çekirdek
      ctx.beginPath();
      ctx.fillStyle = Util.grey(255, Math.min(1, a + 0.3));
      ctx.arc(p.x, p.y, s, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  /* ==========================================================
     RENDER LAYER — constellation lines
     Sadece görünür ambient parçacıklar arasında ince çizgiler
     ========================================================== */
  function renderConstellations() {
    const ctx = State.ctx;
    const maxD2 = CONFIG.constellation.maxDistance * CONFIG.constellation.maxDistance;
    const list = Systems.ambient;
    const stride = 3;   // performans için seyrek kontrol

    ctx.lineWidth = 0.5;

    for (let i = 0; i < list.length; i += stride) {
      const a = list[i];
      let connections = 0;

      for (let j = i + 1; j < list.length && connections < CONFIG.constellation.maxConnections; j += stride) {
        const b = list[j];
        const d2 = Util.dist2(a.x, a.y, b.x, b.y);

        if (d2 < maxD2) {
          const d = Math.sqrt(d2);
          const t = 1 - d / CONFIG.constellation.maxDistance;
          const alpha = t * CONFIG.constellation.alphaFactor;

          ctx.strokeStyle = Util.grey(255, alpha);
          ctx.beginPath();
          ctx.moveTo(a.x, a.y);
          ctx.lineTo(b.x, b.y);
          ctx.stroke();

          connections++;
        }
      }
    }
  }

  /* ==========================================================
     RENDER LAYER — ripples
     ========================================================== */
  function renderRipples(dt) {
    const ctx = State.ctx;

    for (let i = State.ripples.length - 1; i >= 0; i--) {
      const r = State.ripples[i];
      r.r += 12 * dt;
      r.alpha *= 0.965;

      if (r.r >= r.maxR || r.alpha < 0.01) {
        State.ripples.splice(i, 1);
        continue;
      }

      ctx.strokeStyle = Util.grey(255, r.alpha);
      ctx.lineWidth = 1.2;
      ctx.beginPath();
      ctx.arc(r.x, r.y, r.r, 0, Math.PI * 2);
      ctx.stroke();

      ctx.strokeStyle = Util.grey(255, r.alpha * 0.4);
      ctx.lineWidth = 2.5;
      ctx.beginPath();
      ctx.arc(r.x, r.y, r.r * 0.92, 0, Math.PI * 2);
      ctx.stroke();
    }
  }

  /* ==========================================================
     MAIN LOOP
     ========================================================== */
  function frame(now) {
    const ctx = State.ctx;

    if (!State.lastTime) State.lastTime = now;
    const dt = Math.min((now - State.lastTime) / 16.67, 3);
    State.lastTime = now;
    State.globalTime = now;
    State.frameCount++;

    // Shake decay
    if (State.shake.decay > 0.001) {
      State.shake.decay *= 0.9;
    } else {
      State.shake.x = 0;
      State.shake.y = 0;
    }

    // Arka plan temizle
    ctx.clearRect(0, 0, State.W, State.H);

    // Shake transform
    ctx.save();
    if (State.shake.decay > 0.001) {
      ctx.translate(
        State.shake.x * State.shake.decay,
        State.shake.y * State.shake.decay
      );
    }

    // Katmanlar
    ctx.globalCompositeOperation = 'lighter';

    renderAurora(heartbeat(now));
    renderFarStars();
    renderBokeh(dt);
    renderConstellations();
    renderAmbient(dt);
    renderHeart(dt, heartbeat(now));
    renderRipples(dt);

    ctx.globalCompositeOperation = 'source-over';
    ctx.restore();

    // Grain
    const grainX = (State.frameCount * 17) % 200 - 100;
    const grainY = (State.frameCount * 11) % 200 - 100;
    Grain.render(ctx, State.W, State.H, grainX, grainY);

    requestAnimationFrame(frame);
  }

  /* ==========================================================
     TITLE REVEAL
     ========================================================== */
  function buildTitle() {
    const title = document.getElementById('title');
    const text = 'Seni Seviyorum';
    title.innerHTML = '';

    // Her karakter için span oluştur, gecikme artarak
    const startDelay = 0.8;      // splash sonrası başlangıç
    const perChar = 0.06;
    let charIndex = 0;

    for (let i = 0; i < text.length; i++) {
      const ch = text[i];
      if (ch === ' ') {
        const span = document.createElement('span');
        span.className = 'space';
        title.appendChild(span);
        continue;
      }
      const span = document.createElement('span');
      span.className = 'char';
      span.textContent = ch;
      const delay = startDelay + charIndex * perChar;
      span.style.setProperty('--delay', delay + 's');
      title.appendChild(span);
      charIndex++;
    }
  }

  /* ==========================================================
     SPLASH HANDLING
     ========================================================== */
  function runSplash() {
    const splash = document.getElementById('splash');

    // Sayfa yüklenince 2.4 sn bekle, sonra kapat
    const ready = () => {
      setTimeout(() => {
        splash.classList.add('dismiss');
        setTimeout(() => {
          splash.classList.add('hidden');
        }, 700);
      }, 2400);
    };

    if (document.readyState === 'complete') {
      ready();
    } else {
      window.addEventListener('load', ready);
    }
  }

  /* ==========================================================
     INIT
     ========================================================== */
  function init() {
    State.canvas = document.getElementById('canvas');
    State.ctx = State.canvas.getContext('2d', { alpha: true });
    State.reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

    resize();
    attachInput();
    buildTitle();
    runSplash();

    // Grain dokusunu periyodik yenile (hareketli görünsün)
    setInterval(() => Grain.regenerate(), 120);

    requestAnimationFrame(frame);
  }

  /* ==========================================================
     BAŞLAT
     ========================================================== */
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }

})();
</script>
</body>
</html>
